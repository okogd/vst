name: Build VST3 (Windows x64)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RiserLab-VST3-x64
          path: build/RiserLab_artefacts/Release/VST3/RiserLab.vst3
